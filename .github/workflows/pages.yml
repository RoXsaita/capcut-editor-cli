name: Pages

# Publishes site/ (one static page, no build step) to GitHub Pages.
#
# Inert until a maintainer picks Settings → Pages → Source: "GitHub Actions" once. The
# workflow token cannot turn Pages on by itself, so until then the first step finds no
# Pages site and every later step is skipped: the run is green and says so in its summary.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Is Pages enabled for this repository?
        id: enabled
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$REPO/pages" --silent 2>/dev/null; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "Pages is not enabled: Settings → Pages → Source: GitHub Actions, then re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out source
        if: steps.enabled.outputs.value == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure Pages
        if: steps.enabled.outputs.value == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site/
        if: steps.enabled.outputs.value == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy
        id: deployment
        if: steps.enabled.outputs.value == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
