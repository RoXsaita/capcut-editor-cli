<!doctype html>
<!--
  plain — the fallback carousel theme. One static slide per renderSlide() call.

  The theme contract (docs/carousel-spec.md, "Themes"): src/carousel.mjs loads this page once,
  then calls window.renderSlide(data) per slide and screenshots the canvas. The page must
    - size itself to data.canvas, keep every text and card inside data.inset;
    - load data.fonts; set data.vars as --kebab-case custom properties;
    - tag every piece of text with data-role (coverHeadline, headline, kicker, sub, body, figure,
      label, code, terminal, termHeader, eyebrow, hint, keyword, after, swipe, footer) so QA can measure it;
    - return { shots: [rect], cards: [rect], texts: [{ role, px, rect, text }] }, rects in canvas px,
      one shot/card per entry of data.shots, in order, then the terminal card if there is one.
  Kinds: cover | step | terminal | proof | compare | note | prompt | cta. `code` in backticks is a mono chip.
  A terminal slide retypes the frame's lines (data.terminal: header lines, then lines), verbatim.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  :root {
    --brand: #3D3D3D; --accent: #FFB020; --ink: #0B0B14; --muted: #4A4A5C; --bg: #F5F5F9; --card: #FFFFFF;
    --w: 1080px; --h: 1440px; --inset: 100px;
    --pad-top: 0px; --pad-bottom: 0px; --badge: 108px; --kicker: 30px; --h1: 72px; --h1-cover: 96px; --sub: 44px;
    --body: 44px; --code: 40px; --label: 32px; --figure: 120px; --footer: 30px; --gap: 36px;
    --card-margin: 100px; --card-border: 4px; --card-radius: 32px; --shadow: 0 18px 48px rgba(11, 11, 20, 0.12);
    --terminal: 44px; --term-header: 30px; --terminal-bg: #1E1E22; --terminal-ink: #ECECF2; --terminal-muted: #9A9AA8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--bg); }
  body { font-family: 'Plex Arabic', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #slide { position: relative; width: var(--w); height: var(--h); display: flex; flex-direction: column;
           padding: calc(var(--inset) + var(--pad-top)) var(--inset) calc(var(--inset) + var(--pad-bottom)); }
  .group { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: var(--gap); }
  .head { display: flex; gap: 28px; align-items: flex-start; }
  .badge { flex: none; width: var(--badge); height: var(--badge); border-radius: 50%; background: var(--brand); color: #fff;
           font: 700 calc(var(--badge) * 0.6)/var(--badge) 'Plex Arabic'; text-align: center; }
  .titles { flex: 1; min-width: 0; }
  .kicker { font: 700 var(--kicker)/1.2 'Plex Arabic'; color: var(--brand); margin-bottom: 10px; }
  h1 { font: 700 var(--h1)/1.2 'Plex Arabic'; }
  h1.cover { font-size: var(--h1-cover); line-height: 1.15; }
  .sub { margin-top: 14px; font: 600 var(--sub)/1.4 'Plex Arabic'; color: var(--muted); }
  .body { font: 600 var(--body)/1.55 'Plex Arabic'; }
  .body p + p, .body li + li { margin-top: 18px; }
  .body ol { padding-inline-start: 1.2em; }
  code { font-family: 'Mono', monospace; font-weight: 700; direction: ltr; unicode-bidi: isolate; font-size: 0.82em;
         background: var(--accent); color: var(--ink); padding: 0 14px; border-radius: 12px; white-space: nowrap; }
  .eyebrow { align-self: flex-start; font: 700 var(--kicker)/1 'Plex Arabic'; color: var(--brand);
             border: 4px solid var(--brand); border-radius: 40px; padding: 12px 24px; }
  .card { position: relative; flex: none; align-self: center; direction: ltr; border: var(--card-border) solid var(--brand);
          border-radius: var(--card-radius); background: var(--card); overflow: hidden; box-shadow: var(--shadow); }
  .card.dark { background: #1E1E22; }
  .card img { display: block; }
  .label { font: 700 var(--label)/1.2 'Plex Arabic'; color: var(--muted); margin-bottom: -18px; }
  .figure { align-self: center; font: 700 var(--figure)/1.05 'Plex Arabic'; direction: ltr; unicode-bidi: isolate;
            background: linear-gradient(transparent 58%, var(--accent) 58%, var(--accent) 92%, transparent 92%); padding: 0 12px; }
  .marker { position: absolute; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%;
            border: 8px solid var(--brand); box-shadow: 0 0 0 4px #fff, inset 0 0 0 4px #fff; }
  .marker::after { content: ''; position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px;
                   border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 3px #fff; }
  .highlight { position: absolute; border: 7px solid var(--brand); border-radius: 14px; box-shadow: 0 0 0 3px #fff; }
  .mask { position: absolute; border-radius: 6px; }
  .term { flex: none; align-self: stretch; margin: 0 calc(var(--card-margin) - var(--inset)); direction: ltr; text-align: left;
          background: var(--terminal-bg); color: var(--terminal-ink); border: var(--card-border) solid var(--brand);
          border-radius: var(--card-radius); box-shadow: var(--shadow); padding: 34px 36px; }
  .term .th { font: 400 var(--term-header)/1.35 'Mono', monospace; color: var(--terminal-muted); white-space: pre-wrap; word-break: break-word;
              padding-bottom: 18px; margin-bottom: 22px; border-bottom: 2px solid rgba(255, 255, 255, 0.14); }
  .term pre { font: 700 var(--terminal)/1.32 'Mono', monospace; white-space: pre-wrap; word-break: break-word; }
  .term pre + pre { margin-top: 14px; }
  .term pre.hl { outline: 6px solid var(--accent); outline-offset: 8px; border-radius: 6px; }
  .term .glyph { color: var(--accent); }
  .term .hang { padding-left: 2ch; text-indent: -2ch; }  /* a wrapped line continues under the text, not the glyph */
  .needs h2 { font: 700 var(--sub)/1.3 'Plex Arabic'; margin-bottom: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 14px; }
  .chip { font: 600 var(--sub)/1.25 'Plex Arabic'; background: var(--card); border: 4px solid var(--brand); border-radius: 22px; padding: 10px 22px; }
  .blocks { display: flex; flex-direction: column; gap: 26px; }
  .block .label { margin-bottom: 10px; }
  .block pre { direction: ltr; text-align: left; white-space: pre-wrap; word-break: break-word; font: 700 var(--code)/1.35 'Mono', monospace;
               background: var(--card); border: var(--card-border) solid var(--brand); border-radius: calc(var(--card-radius) * 0.6); padding: 22px 28px; }
  .cta-card { background: var(--brand); color: #fff; border-radius: var(--card-radius); padding: 56px 48px; text-align: center; }
  .cta-card .hint { font: 600 var(--sub)/1.3 'Plex Arabic'; opacity: 0.92; }
  .cta-card .kw { margin-top: 18px; font: 700 150px/1.1 'Plex Arabic'; }
  .cta-card .save { font: 700 calc(var(--h1) * 1.05)/1.3 'Plex Arabic'; }
  .after { font: 600 var(--sub)/1.4 'Plex Arabic'; color: var(--muted); }
  footer { flex: none; display: flex; justify-content: space-between; align-items: center; padding-top: 24px; font: 700 var(--footer)/1 'Plex Arabic'; }
  footer .handle, footer .count { direction: ltr; }
  footer .count, footer .swipe { color: var(--muted); }
</style>
</head>
<body>
<div id="slide"></div>
<script>
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const rich = s => esc(s).replace(/`([^`]+)`/g, (_, code) => `<code>${code}</code>`);
  const kebab = key => key.replace(/[A-Z]/g, c => `-${c.toLowerCase()}`);
  const loaded = new Set();

  async function loadFonts(fonts) {
    for (const f of fonts || []) {
      const key = `${f.family}|${f.url}`;
      if (loaded.has(key)) continue;
      const face = new FontFace(f.family, `url(${f.url})`, { weight: String(f.weight || 400), ...(f.range ? { unicodeRange: f.range } : {}) });
      document.fonts.add(await face.load());
      loaded.add(key);
    }
  }

  function card(shot, i) {
    const dark = shot.dark ? '#1E1E22' : '#ECECF2';
    const masks = (shot.masks || []).map(m => `<div class="mask" style="left:${m.rect[0]}px;top:${m.rect[1]}px;width:${m.rect[2]}px;height:${m.rect[3]}px;background:${m.color || dark}"></div>`).join('');
    const hl = shot.highlight ? `<div class="highlight" style="left:${shot.highlight[0]}px;top:${shot.highlight[1]}px;width:${shot.highlight[2]}px;height:${shot.highlight[3]}px"></div>` : '';
    const mk = shot.marker ? `<div class="marker" style="left:${shot.marker.x}px;top:${shot.marker.y}px"></div>` : '';
    const label = shot.label ? `<div class="label" data-role="label">${rich(shot.label)}</div>` : '';
    return `${label}<div class="card${shot.dark ? ' dark' : ''}" data-card="${i}"><div class="inner" style="position:relative;width:${shot.width}px;height:${shot.height}px;transform-origin:top left">
      <img src="${shot.url}" width="${shot.width}" height="${shot.height}" alt="">${masks}${hl}${mk}</div></div>`;
  }
  const cards = d => (d.shots || []).map(card).join('');
  // The prompt or bullet a line starts with keeps its glyph, in the accent, as the real output did.
  const LEAD = /^([>›❯$#⏺●⎿└│]\s?)(.*)$/s;
  const termLine = text => { const m = String(text).match(LEAD); return m ? `<span class="glyph">${esc(m[1])}</span>${esc(m[2])}` : esc(text); };
  const hang = text => (LEAD.test(String(text)) ? ' hang' : '');
  const terminal = d => `<div class="term" data-term>${d.terminal.header.map(h => `<div class="th${hang(h)}" data-role="termHeader">${esc(h)}</div>`).join('')}${
    d.terminal.lines.map(l => `<pre data-role="terminal" class="${l.highlight ? 'hl' : ''}${hang(l.text)}">${termLine(l.text)}</pre>`).join('')}</div>`;
  const titles = (d, cover) => `<div class="titles">${d.kicker ? `<div class="kicker" data-role="kicker">${esc(d.kicker)}</div>` : ''}<h1 class="${cover ? 'cover' : ''}" data-role="${cover ? 'coverHeadline' : 'headline'}">${rich(d.headline)}</h1>${d.sub ? `<div class="sub" data-role="sub">${rich(d.sub)}</div>` : ''}</div>`;
  const body = d => (d.body || d.items.length) ? `<div class="body">${String(d.body || '').split(/\n{2,}/).filter(Boolean).map(p => `<p data-role="body">${rich(p)}</p>`).join('')}${d.items.length ? `<ol>${d.items.map(it => `<li data-role="body">${rich(it)}</li>`).join('')}</ol>` : ''}</div>` : '';

  function slideHtml(d) {
    const swipe = d.kind === 'cover' && d.labels.swipe ? `<span class="swipe" data-role="swipe">${esc(d.labels.swipe)}</span>` : '';
    const footer = `<footer><span class="handle" data-role="footer">${esc(d.handle)}</span>${swipe}<span class="count" data-role="footer">${d.index}/${d.total}</span></footer>`;
    let group;
    switch (d.kind) {
      case 'cover':
        group = `${d.labels.eyebrow ? `<div class="eyebrow" data-role="eyebrow">${esc(d.labels.eyebrow)}</div>` : ''}${titles(d, true)}${cards(d)}
          ${d.needs.length ? `<div class="needs"><h2 data-role="sub">${esc(d.labels.needs)}</h2><div class="chips">${d.needs.map(n => `<span class="chip" data-role="sub">${rich(n)}</span>`).join('')}</div></div>` : ''}`;
        break;
      case 'step':
        group = `<div class="head"><div class="badge">${esc(d.number)}</div>${titles(d)}</div>${cards(d)}${body(d)}`;
        break;
      case 'terminal':
        group = `<div class="head"><div class="badge">${esc(d.number)}</div>${titles(d)}</div>${terminal(d)}${body(d)}`;
        break;
      case 'proof':
        group = `${titles(d)}${cards(d)}${d.figure ? `<div class="figure" data-role="figure">${rich(d.figure)}</div>` : ''}${body(d)}`;
        break;
      case 'compare':
        group = `${titles(d)}${cards(d)}${body(d)}`;
        break;
      case 'prompt':
        group = `${titles(d)}<div class="blocks">${d.blocks.map(b => `<div class="block">${b.label ? `<div class="label" data-role="label">${rich(b.label)}</div>` : ''}<pre data-role="code">${esc(b.text)}</pre></div>`).join('')}</div>`;
        break;
      case 'cta':
        group = `${titles(d)}<div class="cta-card">${d.keyword
          ? `<div class="hint" data-role="hint">${esc(d.labels.cta)}</div><div class="kw" data-role="keyword">${esc(d.keyword)}</div>`
          : `<div class="save" data-role="hint">${rich(d.labels.save)}</div>`}</div>${d.after ? `<div class="after" data-role="after">${rich(d.after)}</div>` : ''}`;
        break;
      default: // note (and its alias text)
        group = `${titles(d)}${body(d)}${cards(d)}`;
    }
    return `<div class="group" id="group">${group}</div>${footer}`;
  }

  const rect = el => { const r = el.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; };

  window.renderSlide = async function renderSlide(d) {
    const root = document.documentElement.style;
    root.setProperty('--w', `${d.canvas.width}px`);
    root.setProperty('--h', `${d.canvas.height}px`);
    root.setProperty('--inset', `${d.inset}px`);
    for (const [key, value] of Object.entries(d.vars || {})) root.setProperty(`--${kebab(key)}`, typeof value === 'number' ? `${value}px` : String(value));
    root.setProperty('--brand', d.colors.brand);
    root.setProperty('--accent', d.colors.accent);
    root.setProperty('--ink', d.colors.ink);
    await loadFonts(d.fonts);
    const slide = document.getElementById('slide');
    slide.innerHTML = slideHtml(d);
    await Promise.all([...slide.querySelectorAll('img')].map(img => img.complete ? null : new Promise((ok, no) => { img.onload = ok; img.onerror = () => no(new Error(`image failed: ${img.src}`)); })));
    await document.fonts.ready;
    const cardEls = [...slide.querySelectorAll('.card')];
    if (cardEls.length) {
      // Fit every card into what the rest of the group leaves, at one shared scale (a comparison
      // keeps both sides the same size). QA measures the result, so a shrunk shot fails on its
      // text size rather than passing on paper.
      const group = document.getElementById('group');
      const gap = parseFloat(getComputedStyle(group).rowGap) || 0;
      const border = parseFloat(getComputedStyle(cardEls[0]).borderTopWidth) || 0;
      const others = [...group.children].filter(el => !el.classList.contains('card'));
      const used = others.reduce((sum, el) => sum + el.getBoundingClientRect().height, 0) + gap * (group.children.length - 1);
      const natural = d.shots.reduce((sum, s) => sum + s.height, 0);
      const scale = Math.min(1, (group.getBoundingClientRect().height - used - 2 * border * cardEls.length) / natural);
      cardEls.forEach((el, i) => {
        el.querySelector('.inner').style.transform = `scale(${scale})`;
        el.style.width = `${Math.round(d.shots[i].width * scale) + 2 * border}px`;
        el.style.height = `${Math.round(d.shots[i].height * scale) + 2 * border}px`;
      });
    }
    const term = slide.querySelector('[data-term]');
    if (term) {
      // Largest size that keeps the longest line whole, down to the theme's code size; below that it wraps.
      const floor = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--code')) || 40;  // the code floor
      const pres = [...term.querySelectorAll('pre')];
      pres.forEach(p => { p.style.whiteSpace = 'pre'; });
      let px = parseFloat(getComputedStyle(pres[0] || term).fontSize);
      const room = term.clientWidth - parseFloat(getComputedStyle(term).paddingLeft) - parseFloat(getComputedStyle(term).paddingRight);
      const widest = Math.max(0, ...pres.map(p => p.scrollWidth));
      if (widest > room) px = Math.max(floor, Math.floor(px * room / widest));
      pres.forEach(p => { p.style.fontSize = `${px}px`; p.style.whiteSpace = ''; });
    }
    return {
      shots: cardEls.map(el => rect(el.querySelector('.inner'))),
      cards: [...cardEls, ...(term ? [term] : [])].map(rect),
      texts: [...slide.querySelectorAll('[data-role]')].map(el => ({ role: el.dataset.role, px: parseFloat(getComputedStyle(el).fontSize), rect: rect(el), text: el.innerText })),
    };
  };
</script>
</body>
</html>
