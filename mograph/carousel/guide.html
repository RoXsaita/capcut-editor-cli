<!doctype html>
<!--
  guide — one static slide of a guide carousel (1080×1440 by default, light background).
  Driven by src/carousel.mjs: window.renderSlide(data) sets the canvas, the theme (every key of
  data.theme becomes a --kebab-case custom property, so the look is tuned from the spec, not
  here), lays the slide out and returns the boxes QA measures: { shot, card, shotScale }.
  Kinds: cover | step | text | prompt | cta. Text in `backticks` renders as a code chip (the
  slide's one accent); everything else is IBM Plex Sans Arabic, right to left.
  Text stays inside data.safe (x from the sides, y from top and bottom).
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  :root {
    --brand: #3D3D3D; --accent: #FFB020; --ink: #0B0B14; --muted: #4A4A5C; --bg: #F5F5F9; --card: #FFFFFF;
    --w: 1080px; --h: 1440px; --safe-x: 100px; --safe-y: 45px;
    --pad-x: 100px; --pad-top: 48px; --pad-bottom: 40px; --badge: 104px; --kicker: 30px; --h1: 60px; --h1-cover: 80px;
    --sub: 34px; --body: 38px; --footer: 30px; --gap: 40px; --card-margin: 60px; --card-border: 4px; --card-radius: 36px;
    --shadow: 0 18px 48px rgba(11, 11, 20, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--bg); }
  body { font-family: 'Plex Arabic', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #slide { position: relative; width: var(--w); height: var(--h); display: flex; flex-direction: column;
           padding: calc(var(--safe-y) + var(--pad-top)) 0 calc(var(--safe-y) + var(--pad-bottom)); }
  .pad { padding: 0 var(--pad-x); }
  .group { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: var(--gap); }
  /* The step block: badge, kicker, headline, one-line sub. Same place on every step slide. */
  .head { display: flex; gap: 28px; align-items: flex-start; }
  .badge { flex: none; width: var(--badge); height: var(--badge); border-radius: 50%; background: var(--brand); color: #fff;
           font: 700 calc(var(--badge) * 0.62)/var(--badge) 'Plex Arabic'; text-align: center; }
  .titles { flex: 1; min-width: 0; }
  .kicker { font: 700 var(--kicker)/1.2 'Plex Arabic'; color: var(--brand); margin-bottom: 10px; }
  h1 { font: 700 var(--h1)/1.22 'Plex Arabic'; letter-spacing: 0; }
  .cover h1 { font-size: var(--h1-cover); line-height: 1.18; }
  .sub { margin-top: 14px; font: 600 var(--sub)/1.4 'Plex Arabic'; color: var(--muted); }
  .body { font: 600 var(--body)/1.55 'Plex Arabic'; }
  .body p + p { margin-top: 24px; }
  code { font-family: 'Mono', monospace; font-weight: 700; direction: ltr; unicode-bidi: isolate; font-size: 0.82em;
         background: var(--accent); color: var(--ink); padding: 0 14px; border-radius: 12px; white-space: nowrap; }
  .eyebrow { display: inline-block; margin-bottom: 22px; font: 700 var(--kicker)/1 'Plex Arabic'; color: var(--brand);
             border: 4px solid var(--brand); border-radius: 40px; padding: 12px 24px; }
  /* The shot: a framed card, its real UI inside, never full bleed. */
  .card { position: relative; flex: none; align-self: center; direction: ltr; border: var(--card-border) solid var(--brand);
          border-radius: var(--card-radius); background: var(--card); overflow: hidden; box-shadow: var(--shadow); }
  .card.dark { background: #1E1E22; }
  .card img { display: block; }
  .marker { position: absolute; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%;
            border: 8px solid var(--brand); box-shadow: 0 0 0 4px #fff, inset 0 0 0 4px #fff; }
  .marker::after { content: ''; position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px;
                   border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 3px #fff; }
  .highlight { position: absolute; border: 7px solid var(--brand); border-radius: 14px; box-shadow: 0 0 0 3px #fff; }
  .mask { position: absolute; border-radius: 10px; }
  .needs h2 { font: 700 var(--sub)/1.3 'Plex Arabic'; margin-bottom: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 14px; }
  .chip { font: 600 calc(var(--sub) * 0.94)/1.25 'Plex Arabic'; background: var(--card); border: 4px solid var(--brand); border-radius: 22px; padding: 12px 24px; }
  .blocks { display: flex; flex-direction: column; gap: 30px; }
  .block .label { font: 600 var(--sub)/1.3 'Plex Arabic'; color: var(--muted); margin-bottom: 12px; }
  .block pre { direction: ltr; text-align: left; white-space: pre-wrap; word-break: break-word; font: 700 40px/1.35 'Mono', monospace;
               background: var(--card); border: var(--card-border) solid var(--brand); border-radius: calc(var(--card-radius) * 0.6); padding: 24px 30px; }
  .cta-card { background: var(--brand); color: #fff; border-radius: var(--card-radius); padding: 56px 48px; text-align: center; }
  .cta-card .hint { font: 600 calc(var(--sub) * 1.1)/1.3 'Plex Arabic'; opacity: 0.92; }
  .cta-card .kw { margin-top: 18px; font: 700 150px/1.1 'Plex Arabic'; }
  .cta-card .kw.save { margin-top: 0; font-size: calc(var(--h1) * 1.1); line-height: 1.3; }
  .after { margin-top: 36px; font: 600 calc(var(--sub) * 1.15)/1.4 'Plex Arabic'; color: var(--muted); }
  footer { flex: none; display: flex; justify-content: space-between; align-items: center; padding: 28px var(--pad-x) 0; font: 700 var(--footer)/1 'Plex Arabic'; }
  footer .handle { direction: ltr; }
  footer .count { direction: ltr; color: var(--muted); }
</style>
</head>
<body>
<div id="slide"></div>
<script>
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  // `code` → a chip; the rest stays plain text.
  const rich = s => esc(s).replace(/`([^`]+)`/g, (_, code) => `<code>${code}</code>`);
  const kebab = key => key.replace(/[A-Z]/g, c => `-${c.toLowerCase()}`);

  async function loadFonts(base) {
    if (window.__fontsLoaded) return;
    const faces = [
      ['Plex Arabic', 'ibm-plex-sans-arabic-arabic-600-normal.woff2', 600, 'U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF, U+200C-200E'],
      ['Plex Arabic', 'ibm-plex-sans-arabic-arabic-700-normal.woff2', 700, 'U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF, U+200C-200E'],
      ['Plex Arabic', 'ibm-plex-sans-arabic-latin-600-normal.woff2', 600, 'U+0000-00FF, U+2000-206F'],
      ['Plex Arabic', 'ibm-plex-sans-arabic-latin-700-normal.woff2', 700, 'U+0000-00FF, U+2000-206F'],
      ['Mono', 'jetbrains-mono-latin-400-normal.woff2', 400, 'U+0000-00FF, U+2000-206F'],
      ['Mono', 'jetbrains-mono-latin-700-normal.woff2', 700, 'U+0000-00FF, U+2000-206F'],
    ];
    for (const [family, file, weight, range] of faces) {
      const face = new FontFace(family, `url(${base}${file})`, { weight: String(weight), unicodeRange: range });
      document.fonts.add(await face.load());
    }
    window.__fontsLoaded = true;
  }

  function cardHtml(shot) {
    if (!shot) return '';
    const masks = (shot.masks || []).map(m => `<div class="mask" style="left:${m.rect[0]}px;top:${m.rect[1]}px;width:${m.rect[2]}px;height:${m.rect[3]}px;background:${m.color || (shot.dark ? '#1E1E22' : '#ECECF2')}"></div>`).join('');
    const hl = shot.highlight ? `<div class="highlight" style="left:${shot.highlight[0]}px;top:${shot.highlight[1]}px;width:${shot.highlight[2]}px;height:${shot.highlight[3]}px"></div>` : '';
    const mk = shot.marker ? `<div class="marker" style="left:${shot.marker.x}px;top:${shot.marker.y}px"></div>` : '';
    return `<div class="card${shot.dark ? ' dark' : ''}" id="card"><div id="shot-inner" style="position:relative;width:${shot.width}px;height:${shot.height}px;transform-origin:top left">
      <img src="${shot.url}" width="${shot.width}" height="${shot.height}" alt="">${masks}${hl}${mk}</div></div>`;
  }

  const titles = d => `<div class="titles">${d.kicker ? `<div class="kicker">${esc(d.kicker)}</div>` : ''}<h1>${rich(d.headline)}</h1>${d.sub ? `<div class="sub">${rich(d.sub)}</div>` : ''}</div>`;
  const paragraphs = text => String(text || '').split(/\n{2,}/).filter(Boolean).map(p => `<p>${rich(p)}</p>`).join('');

  function body(d) {
    const footer = `<footer><span class="handle">${esc(d.handle)}</span><span class="count">${d.index}/${d.total}</span></footer>`;
    let group;
    if (d.kind === 'cover') {
      group = `<div class="pad cover">${d.labels.eyebrow ? `<div class="eyebrow">${esc(d.labels.eyebrow)}</div>` : ''}${titles(d)}</div>
        ${cardHtml(d.shot)}
        ${d.needs.length ? `<div class="pad needs"><h2>${esc(d.labels.needs)}</h2><div class="chips">${d.needs.map(n => `<span class="chip">${rich(n)}</span>`).join('')}</div></div>` : ''}`;
    } else if (d.kind === 'step') {
      group = `<div class="pad head"><div class="badge">${esc(d.number)}</div>${titles(d)}</div>${cardHtml(d.shot)}
        ${d.body ? `<div class="pad body">${paragraphs(d.body)}</div>` : ''}`;
    } else if (d.kind === 'text') {
      group = `<div class="pad">${titles(d)}</div>${d.body ? `<div class="pad body">${paragraphs(d.body)}</div>` : ''}${cardHtml(d.shot)}`;
    } else if (d.kind === 'prompt') {
      group = `<div class="pad">${titles(d)}</div>
        <div class="pad blocks">${d.blocks.map(b => `<div class="block">${b.label ? `<div class="label">${rich(b.label)}</div>` : ''}<pre>${esc(b.text)}</pre></div>`).join('')}</div>`;
    } else {
      group = `<div class="pad">${titles(d)}</div>
        <div class="pad"><div class="cta-card">${d.keyword ? `<div class="hint">${esc(d.labels.cta)}</div><div class="kw">${esc(d.keyword)}</div>` : `<div class="kw save">${rich(d.labels.save)}</div>`}</div>
        ${d.after ? `<div class="after">${rich(d.after)}</div>` : ''}</div>`;
    }
    return `<div class="group" id="group">${group}</div>${footer}`;
  }

  window.renderSlide = async function renderSlide(d) {
    const root = document.documentElement.style;
    root.setProperty('--w', `${d.canvas.width}px`);
    root.setProperty('--h', `${d.canvas.height}px`);
    root.setProperty('--safe-x', `${d.safe.x}px`);
    root.setProperty('--safe-y', `${d.safe.y}px`);
    for (const [key, value] of Object.entries(d.theme || {})) root.setProperty(`--${kebab(key)}`, typeof value === 'number' ? `${value}px` : String(value));
    root.setProperty('--brand', d.colors.brand);
    root.setProperty('--accent', d.colors.accent);
    root.setProperty('--ink', d.colors.ink);
    await loadFonts(d.fontsBase);
    const slide = document.getElementById('slide');
    slide.innerHTML = body(d);
    await Promise.all([...slide.querySelectorAll('img')].map(img => img.complete ? null : new Promise((ok, no) => { img.onload = ok; img.onerror = () => no(new Error(`image failed: ${img.src}`)); })));
    await document.fonts.ready;
    const card = document.getElementById('card');
    if (!card) return { shot: null, card: null, shotScale: null };
    // Fit the shot into what the rest of the group leaves; QA measures the result, so a shot
    // that had to shrink fails on its text size rather than passing on paper.
    const group = document.getElementById('group');
    const inner = document.getElementById('shot-inner');
    const gap = parseFloat(getComputedStyle(group).rowGap) || 0;
    const border = parseFloat(getComputedStyle(card).borderTopWidth) || 0;
    const others = [...group.children].filter(el => el !== card);
    const used = others.reduce((sum, el) => sum + el.getBoundingClientRect().height, 0) + gap * others.length;
    const room = group.getBoundingClientRect().height - used - 2 * border;
    const shotScale = Math.min(1, room / d.shot.height);
    inner.style.transform = `scale(${shotScale})`;
    card.style.width = `${Math.round(d.shot.width * shotScale) + 2 * border}px`;
    card.style.height = `${Math.round(d.shot.height * shotScale) + 2 * border}px`;
    const r = inner.getBoundingClientRect();
    const c = card.getBoundingClientRect();
    return { shot: { x: r.left, y: r.top, w: r.width, h: r.height }, card: { x: c.left, y: c.top, w: c.width, h: c.height }, shotScale };
  };
</script>
</body>
</html>
