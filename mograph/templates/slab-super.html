<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>slab-super</title>
<script src="../runtime.js"></script>
<style>
  .group { position: absolute; display: flex; flex-direction: column; align-items: flex-start; gap: 0.11em; }
  .row { display: flex; flex-direction: row; align-items: flex-end; }
  .slab { position: relative; display: block; height: 1.44em; padding: 0 0.38em; overflow: hidden;
          white-space: nowrap; line-height: 1.44em; font-weight: 700; color: var(--mg-text); }
  .slab.ink { background: var(--mg-ink); }
  .slab.brand { background: var(--mg-brand); }
  .slab.tag { font-size: 0.56em; font-weight: 600; height: 1.56em; line-height: 1.56em; padding: 0 0.62em; }
  .slab .txt { display: block; }
  .bar { position: absolute; background: var(--mg-accent); }
</style>
</head>
<body>
<script>
/*
 * slab-super — a 1–5 word super set on solid slabs: an optional small ink tag above, then the line split into an ink slab and a brand slab for the key words, each opening sideways with its text rising inside it, and an accent underline drawn under the key.
 * params: { text, key?: words of text for the brand slab|false (default: last word in reading order), keyAt?: seconds (the key slab waits for its own word), tag?: 1–3 words above, underline?: true|false|"line" (under the key, none, or the whole line), layout?: full-face|card|split-screen (split-screen sits the line on the centre seam), center?: [x, y] canvas px, hold?: seconds }
 * Timing (frames @30): the tag opens from its reading-start edge over 10f (expo) and its text
 * rises inside it over 11f (enter ease, 2f later); each slab of the line follows 5f apart in
 * reading order, the first 6f after the tag, the same way; keyAt holds the key slab back to its own
 * word, so the line lands in two beats. The underline draws under the key (or the whole line) in
 * the reading direction over 14f once the last slab has landed. Hold max(minHold, perWordHold ×
 * words); 7f out: every slab retracts toward the reading end (exit ease), faster than it came.
 * Square corners, no shadows: solid shapes only.
 */
const GROW = 10, RISE = 11, LAG = 2, STEP = 5, AFTER_TAG = 6, BAR = 14, OUT = 7;
const splitWords = s => String(s || '').trim().split(/\s+/).filter(Boolean);
const wordCount = p => splitWords(p.text).length + splitWords(p.tag).length;

/** The line as slabs in reading order: [{ text, brand }]. */
function parts(params) {
  const words = splitWords(params.text);
  if (params.key === false) return [{ text: words.join(' '), brand: false }];
  const key = params.key == null ? [words[words.length - 1]] : splitWords(params.key);
  let at = -1;
  for (let i = 0; i + key.length <= words.length && at < 0; i++) {
    if (key.every((w, j) => words[i + j] === w)) at = i;
  }
  if (at < 0) throw new Error(`MOGRAPH_PARAM: slab-super key "${key.join(' ')}" is not a run of words in text`);
  return [
    { text: words.slice(0, at).join(' '), brand: false },
    { text: key.join(' '), brand: true },
    { text: words.slice(at + key.length).join(' '), brand: false },
  ].filter(p => p.text);
}
function timing(params, tokens, mg) {
  const tagged = splitWords(params.tag).length > 0;
  const list = parts(params);
  const first = tagged ? AFTER_TAG : 0;
  const keyAt = params.keyAt == null ? 0 : Math.round(Number(params.keyAt) * mg.fps);
  if (!(keyAt >= 0)) throw new Error('MOGRAPH_PARAM: slab-super keyAt is seconds from the start');
  // Each slab follows the previous one by STEP; the key slab waits for keyAt, and so do the rest.
  const starts = [];
  list.forEach((p, i) => {
    const chain = i ? starts[i - 1] + STEP : first;
    starts.push(p.brand ? Math.max(chain, keyAt) : chain);
  });
  const landed = starts[starts.length - 1] + LAG + RISE;
  const bar = params.underline !== false && (params.underline === 'line' || params.key !== false);
  const inEnd = bar ? landed + BAR : landed;
  return { tagged, starts, landed, bar, inEnd, total: inEnd + mg.holdFrames(params, wordCount(params)) + OUT };
}

MG.define({
  name: 'slab-super',
  sfx: 'pop',
  motion: 'rich',
  pad: 24,
  build(root, params, tokens, mg) {
    const words = splitWords(params.text);
    if (!words.length) throw new Error('MOGRAPH_PARAM: slab-super needs params.text');
    if (words.length > 5) throw new Error('MOGRAPH_PARAM: slab-super takes 1-5 words; a super is never the sentence');
    if (splitWords(params.tag).length > 3) throw new Error('MOGRAPH_PARAM: slab-super tag takes 1-3 words');
    mg.cssVars(root);
    const rtl = mg.isArabic(params.text) || mg.isArabic(params.tag);
    const group = document.createElement('div');
    group.className = 'group';
    group.setAttribute('dir', rtl ? 'rtl' : 'ltr');
    root.appendChild(group);
    const slab = (row, text, cls) => {
      const el = document.createElement('div');
      el.className = `slab ${cls}`;
      const txt = document.createElement('span');
      txt.className = 'txt';
      el.appendChild(txt);
      mg.words(txt, text);
      el.setAttribute('dir', mg.isArabic(text) ? 'rtl' : 'ltr');
      row.appendChild(el);
      return { el, txt };
    };
    let tag = null;
    if (splitWords(params.tag).length) {
      const row = document.createElement('div');
      row.className = 'row';
      group.appendChild(row);
      tag = slab(row, splitWords(params.tag).join(' '), 'ink tag');
    }
    const row = document.createElement('div');
    row.className = 'row';
    group.appendChild(row);
    const slabs = parts(params).map(p => ({ ...slab(row, p.text, p.brand ? 'brand' : 'ink'), brand: p.brand }));
    const size = tokens.type.super;
    const tm = timing(params, tokens, mg);
    // The text rises from 0.9 of its slab's height below it: keep that travel clear of the UI too.
    const lay = mg.layout(params, { margin: 28 + 1.3 * size });
    const px = mg.fitFont(group, size, lay.safe.w);
    if (lay.name === 'split-screen' && !lay.explicit) {
      // Sit the line on the divider (the 12px seam at the canvas centre), not across it.
      const canvas = mg.input.canvas || { width: 1080, height: 1920 };
      lay.center = [lay.center[0], canvas.height / 2 - 6 - group.getBoundingClientRect().height / 2];
    }
    mg.place(group, lay);
    let bar = null;
    if (tm.bar) {
      const under = params.underline === 'line' ? slabs : slabs.filter(s => s.brand);
      const rs = under.map(s => s.el.getBoundingClientRect());
      const k = { left: Math.min(...rs.map(r => r.left)), bottom: Math.max(...rs.map(r => r.bottom)) };
      k.width = Math.max(...rs.map(r => r.right)) - k.left;
      const g = group.getBoundingClientRect();
      bar = document.createElement('div');
      bar.className = 'bar';
      Object.assign(bar.style, { left: `${k.left - g.left}px`, width: `${k.width}px`,
        top: `${k.bottom - g.top}px`, height: `${Math.max(6, Math.round(px * 0.1))}px` });
      group.appendChild(bar);
    }
    return { tag, slabs, bar, px, rtl, tm, expo: mg.bezier([0, 1, 0, 1]), total: tm.total / mg.fps };
  },
  duration(params, tokens, mg) {
    return timing(params, tokens, mg).total / mg.fps;
  },
  still(params, tokens, mg) {
    return (timing(params, tokens, mg).inEnd + 6) / mg.fps;
  },
  seek(t, s, mg) {
    const { F, ease, win } = mg;
    const q = ease.exit(win(t, s.total - F(OUT), F(OUT)));
    // Reading start / end edges: a slab opens from where the eye starts and retracts to where it ends.
    const open = (el, g) => {
      const hide = (1 - g) * 100, cut = q * 100;
      el.style.clipPath = s.rtl ? `inset(0 ${hide}% 0 ${cut}%)` : `inset(0 ${cut}% 0 ${hide}%)`;
    };
    const run = ({ el, txt }, start) => {
      const g = s.expo(win(t, F(start), F(GROW)));
      const r = ease.enter(win(t, F(start + LAG), F(RISE)));
      open(el, g);
      mg.show(el, g > 0 && q < 1 ? 1 : 0);
      txt.style.transform = `translateY(${(1 - r) * 0.9 * el.offsetHeight}px)`;
    };
    if (s.tag) run(s.tag, 0);
    s.slabs.forEach((slab, i) => run(slab, s.tm.starts[i]));
    if (s.bar) {
      const b = ease.enter(win(t, F(s.tm.landed), F(BAR)));
      s.bar.style.transformOrigin = `${(q > 0) === s.rtl ? 'left' : 'right'} center`;
      s.bar.style.transform = `scaleX(${b * (1 - q)})`;
      mg.show(s.bar, b > 0 && q < 1 ? 1 : 0);
    }
  },
});
</script>
</body>
</html>
