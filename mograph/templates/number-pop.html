<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>number-pop</title>
<script src="../runtime.js"></script>
<style>
  .group { position: absolute; display: flex; flex-direction: column; align-items: center; }
  .num { direction: ltr; unicode-bidi: isolate; white-space: nowrap; line-height: 1; font-weight: 700;
         color: var(--mg-text); font-variant-numeric: tabular-nums lining-nums; letter-spacing: -0.02em;
         display: flex; align-items: baseline;
         text-shadow: 0 4px 6px rgba(var(--mg-ink-rgb), 0.35), 0 16px 48px rgba(var(--mg-ink-rgb), 0.5); }
  .digits { display: inline-block; text-align: right; }
  .affix { display: inline-block; color: var(--mg-accent); font-size: 0.56em; line-height: 1; }
  .affix.pre { margin-right: 0.06em; }
  .affix.post { margin-left: 0.08em; }
  .rule { height: 8px; border-radius: 999px; background: var(--mg-indigo); margin-top: 20px;
          box-shadow: 0 4px 18px rgba(var(--mg-indigo-rgb), 0.55); }
  .label { white-space: nowrap; text-align: center; line-height: 1.3; font-weight: 600; margin-top: 14px;
           color: var(--mg-text);
           text-shadow: 0 2px 3px rgba(var(--mg-ink-rgb), 0.45), 0 8px 26px rgba(var(--mg-ink-rgb), 0.5); }
  .label .mg-word { padding: 0 0.05em; }
</style>
</head>
<body>
<script>
/*
 * number-pop — a stat that counts up and lands: big Latin numeral, accent unit, a short indigo rule and a label.
 * params: { value, prefix?, suffix?|unit?, label?, decimals?, layout?: full-face|card|split-screen, center?: [x, y] canvas px, hold?: seconds }
 * Timing (frames @30): the numeral pops in over 8f (scale .72 → 1, 6% overshoot) while it counts
 * 0 → value over 15f (cubic ease-out, the one place a counter may run near-linear); the unit
 * pops in at 11f and the numeral takes one 6f settle beat as the count lands; the rule draws
 * from the centre (8f) and the label rises word by word from 10f (3f stagger). Hold 45f after
 * the count (or params.hold); 6f out.
 */
const COUNT = 15, OUT = 6, S0 = 0.72;
const hold = (params, mg) => (params.hold != null ? mg.holdFrames(params, 0) : 45);
function parse(params) {
  const raw = String(params.value == null ? '' : params.value).replace(/[,\s]/g, '');
  const value = Number(MG.digits(raw));
  if (!Number.isFinite(value)) throw new Error(`MOGRAPH_PARAM: number-pop needs a numeric params.value (got "${params.value}")`);
  const decimals = params.decimals != null ? Math.max(0, Math.min(4, Number(params.decimals)))
    : (raw.split('.')[1] || '').length;
  return { value, decimals };
}

MG.define({
  name: 'number-pop',
  sfx: 'pop',
  motion: 'rich',
  pad: 32,
  build(root, params, tokens, mg) {
    const { value, decimals } = parse(params);
    mg.cssVars(root);
    const fmt = new Intl.NumberFormat('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals,
      useGrouping: Math.abs(value) >= 10000 });
    const format = v => mg.digits(fmt.format(v));
    const group = document.createElement('div');
    group.className = 'group';
    root.appendChild(group);
    const num = document.createElement('div');
    num.className = 'num';
    num.style.fontSize = `${tokens.type.numeral}px`;
    group.appendChild(num);
    const affix = (text, cls) => {
      if (!text) return null;
      const el = document.createElement('span');
      el.className = `affix ${cls}`;
      el.textContent = mg.digits(String(text));
      num.appendChild(el);
      return el;
    };
    const pre = affix(params.prefix, 'pre');
    const digits = document.createElement('span');
    digits.className = 'digits';
    digits.textContent = format(value);
    num.appendChild(digits);
    const post = affix(params.suffix != null ? params.suffix : params.unit, 'post');
    const rule = document.createElement('div');
    rule.className = 'rule';
    group.appendChild(rule);
    let spans = [];
    let label = null;
    if (params.label) {
      label = document.createElement('div');
      label.className = 'label';
      label.style.fontSize = `${tokens.type.numeralLabel}px`;
      group.appendChild(label);
      spans = mg.words(label, String(params.label));
    }
    const lay = mg.layout(params, { margin: 32 + 24 });
    // Fit the whole stack to the band; the numeral and label scale together.
    let k = 1;
    for (let i = 0; i < 4; i++) {
      const r = group.getBoundingClientRect();
      const f = Math.min(1, lay.safe.w / r.width, lay.safe.h / r.height);
      if (f > 0.995) break;
      k *= f;
      num.style.fontSize = `${Math.floor(tokens.type.numeral * k)}px`;
      if (label) label.style.fontSize = `${Math.floor(tokens.type.numeralLabel * k)}px`;
    }
    // Lock the digit box to the final width: the count grows leftward, the unit never moves.
    digits.style.width = `${Math.ceil(digits.getBoundingClientRect().width)}px`;
    rule.style.width = `${Math.round(Math.max(96, num.getBoundingClientRect().width * 0.32))}px`;
    mg.place(group, lay);
    // Scale the numeral about its baseline centre so the pop feels planted.
    num.style.transformOrigin = '50% 80%';
    return { group, num, digits, pre, post, rule, spans, label, value, format, f: tokens.frames,
      total: (COUNT + hold(params, mg) + OUT) / mg.fps };
  },
  duration(params, tokens, mg) {
    parse(params);
    return (COUNT + hold(params, mg) + OUT) / mg.fps;
  },
  still(params, tokens, mg) {
    return (COUNT + 12) / mg.fps;
  },
  seek(t, s, mg) {
    const { F, ease, win } = mg;
    const q = ease.exit(win(t, s.total - F(OUT), F(OUT)));
    // Count: cubic ease-out, exact at the end.
    const c = win(t, 0, F(COUNT));
    const shown = c >= 1 ? s.value : s.value * (1 - Math.pow(1 - c, 3));
    s.digits.textContent = s.format(shown);
    const pop = win(t, 0, F(8));
    const settle = mg.pulse(t, F(COUNT - 1), F(6));
    s.num.style.transform = `translateY(${(1 - ease.enter(pop)) * 28}px) scale(${(S0 + (1 - S0) * ease.pop(pop)) * (1 + 0.03 * settle)})`;
    s.num.style.filter = `blur(${(1 - ease.enter(pop)) * 8}px)`;
    mg.show(s.num, ease.enter(Math.min(1, pop * 2)));
    for (const [el, start] of [[s.pre, 11], [s.post, 11]]) {
      if (!el) continue;
      const p = win(t, F(start), F(6));
      el.style.transform = `scale(${0.4 + 0.6 * ease.pop(p)})`;
      el.style.transformOrigin = el === s.pre ? '100% 80%' : '0% 80%';
      mg.show(el, ease.enter(Math.min(1, p * 2)));
    }
    const r = ease.enter(win(t, F(8), F(8)));
    s.rule.style.transform = `scaleX(${r})`;
    mg.show(s.rule, r > 0 ? 1 : 0);
    s.spans.forEach((span, i) => {
      const p = ease.enter(win(t, F(10 + i * s.f.stagger), F(s.f.in)));
      mg.show(span, p);
      span.style.transform = `translateY(${(1 - p) * 18}px)`;
    });
    s.group.style.transform = `translateY(${-q * 16}px)`;
    s.group.style.filter = q > 0 ? `blur(${q * 5}px)` : 'none';
    s.group.style.opacity = String(1 - q);
  },
});
</script>
</body>
</html>
