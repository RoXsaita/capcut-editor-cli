<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>cta-card</title>
<script src="../runtime.js"></script>
<style>
  .group { position: absolute; }
  .card { position: relative; }
  .bubble { position: relative; overflow: hidden; display: flex; align-items: center; gap: 0.36em; white-space: nowrap;
            background: var(--mg-ring); color: var(--mg-ink); border-radius: var(--mg-radius-card);
            padding: 0.4em 0.62em 0.4em 0.7em; font-weight: 700; line-height: 1.3;
            box-shadow: 0 18px 40px rgba(var(--mg-ink-rgb), 0.42), 0 3px 8px rgba(var(--mg-ink-rgb), 0.25); }
  .tail { position: absolute; background: var(--mg-ring); }
  .icon { flex: none; width: 1.34em; height: 1.34em; border-radius: 50%; background: var(--mg-indigo);
          display: flex; align-items: center; justify-content: center;
          box-shadow: 0 6px 16px rgba(var(--mg-indigo-rgb), 0.45); }
  .glyph { position: relative; width: 0.7em; height: 0.52em; border: 0.075em solid var(--mg-text);
           border-radius: 0.17em; box-sizing: border-box; display: flex; align-items: center;
           justify-content: center; gap: 0.07em; margin-bottom: 0.06em; }
  .glyph i { width: 0.085em; height: 0.085em; border-radius: 50%; background: var(--mg-text); }
  .glyph b { position: absolute; bottom: -0.2em; width: 0.16em; height: 0.16em; background: var(--mg-text);
             clip-path: polygon(0 0, 100% 0, 0 100%); }
  .line .mg-word { padding: 0 0.04em; }
  .chip { display: inline-block; position: relative; background: var(--mg-indigo); color: var(--mg-text);
          border-radius: var(--mg-radius-chip); padding: 0.02em 0.46em 0.08em; margin: 0 0.1em;
          box-shadow: 0 6px 18px rgba(var(--mg-indigo-rgb), 0.4); unicode-bidi: isolate; }
  .ripple { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<script>
/*
 * cta-card — the comment CTA: a white comment bubble "اكتب [keyword] في التعليقات" with the keyword in an indigo chip that pops, then gets one tap.
 * params: { keyword, text?: string with a {keyword} slot (default "اكتب {keyword} في التعليقات"), layout?: full-face|card|split-screen, center?: [x, y] canvas px, hold?: seconds }
 * Timing (frames @30): the bubble rises and pops in over 10f (enter ease + 6% overshoot) from
 * its tail corner; the comment icon pops at 4f; the words rise in reading order from 6f on a 3f
 * stagger, the keyword chip last with the overshoot; 18f later the chip takes one tap (3f press,
 * 6f release) with a single ripple. 90–120f total (default 104f, or params.hold after the
 * entrance); 6f out, the bubble sinks back toward its tail.
 */
const OUT = 6, BUBBLE = 10, WORDS_AT = 5, CHIP_IN = 8, TAP_AFTER = 18;
const DEFAULT_TEXT = 'اكتب {keyword} في التعليقات';
function parts(params) {
  const keyword = String(params.keyword || '').trim();
  if (!keyword) throw new Error('MOGRAPH_PARAM: cta-card needs params.keyword');
  const text = String(params.text || DEFAULT_TEXT);
  if (!text.includes('{keyword}')) throw new Error('MOGRAPH_PARAM: cta-card params.text needs a {keyword} slot');
  const [before, after] = text.split('{keyword}');
  const words = s => s.trim().split(/\s+/).filter(Boolean);
  return { keyword, before: words(before), after: words(after), text };
}
function timing(params, tokens, mg) {
  const p = parts(params);
  const units = p.before.length + 1 + p.after.length;
  const chipAt = WORDS_AT + p.before.length * tokens.frames.stagger;
  const inEnd = Math.max(WORDS_AT + (units - 1) * tokens.frames.stagger + tokens.frames.in, chipAt + CHIP_IN);
  const tap = chipAt + CHIP_IN + TAP_AFTER;
  const total = params.hold != null ? inEnd + mg.holdFrames(params, 0) + OUT : mg.clamp(104, tap + 9 + 30, 120);
  return { chipAt, inEnd, tap, total };
}

MG.define({
  name: 'cta-card',
  sfx: 'select',
  motion: 'rich',
  pad: 48,
  build(root, params, tokens, mg) {
    const p = parts(params);
    mg.cssVars(root);
    const rtl = mg.isArabic(p.text.replace('{keyword}', ''));
    const group = document.createElement('div');
    group.className = 'group';
    group.style.fontSize = `${tokens.type.list}px`;
    root.appendChild(group);
    const card = document.createElement('div');
    card.className = 'card';
    group.appendChild(card);
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.dir = rtl ? 'rtl' : 'ltr';
    card.appendChild(bubble);
    // The tap ripple is a radial gradient on a bubble-sized layer under the chip: it can never
    // grow the crop box, and the bubble's corners clip it.
    const ripple = document.createElement('div');
    ripple.className = 'ripple';
    bubble.appendChild(ripple);
    // Comment glyph: a small speech bubble with three dots, drawn in CSS. Not inline SVG: SVG
    // under a scale transform rasterises at a cached scale, so a frame would depend on the frame
    // rendered before it (determinism).
    const icon = document.createElement('div');
    icon.className = 'icon';
    icon.innerHTML = '<div class="glyph"><i></i><i></i><i></i><b></b></div>';
    icon.querySelector('b').style[rtl ? 'right' : 'left'] = '0.1em';
    if (rtl) icon.querySelector('b').style.clipPath = 'polygon(0 0, 100% 0, 100% 100%)';
    bubble.appendChild(icon);
    const line = document.createElement('div');
    line.className = 'line';
    bubble.appendChild(line);
    // Words by word; the keyword is one chip unit (its own words inside it, never letters).
    const units = [];
    line.dir = rtl ? 'rtl' : 'ltr';
    const addWords = list => list.forEach(w => {
      const span = document.createElement('span');
      span.className = 'mg-word';
      span.style.display = 'inline-block';
      span.textContent = w;
      line.appendChild(span);
      line.appendChild(document.createTextNode(' '));
      units.push(span);
    });
    addWords(p.before);
    const chip = document.createElement('span');
    chip.className = 'chip';
    line.appendChild(chip);
    line.appendChild(document.createTextNode(' '));
    mg.words(chip, p.keyword);
    units.push(chip);
    addWords(p.after);
    if (line.lastChild && line.lastChild.nodeType === 3) line.lastChild.remove();
    const tail = document.createElement('div');
    tail.className = 'tail';
    card.appendChild(tail);

    const lay = mg.layout(params, { margin: 48 + 36 });
    mg.fitFont(group, tokens.type.list, lay.safe.w, lay.safe.h, tokens.type.micro);
    mg.place(group, lay);
    // Tail under the reading-start corner (right for Arabic), mirrored for LTR; sized in px from
    // the fitted type so its curve scales with the card.
    const em = parseFloat(group.style.fontSize);
    const tw = Math.round(em * 0.5), th = Math.round(em * 0.36);
    const curve = rtl ? `M0 0 H${tw} C${tw * 0.86} ${th * 0.3} ${tw * 0.8} ${th * 0.6} ${tw * 0.93} ${th} C${tw * 0.57} ${th * 0.9} ${tw * 0.29} ${th * 0.55} 0 0 Z`
      : `M${tw} 0 H0 C${tw * 0.14} ${th * 0.3} ${tw * 0.2} ${th * 0.6} ${tw * 0.07} ${th} C${tw * 0.43} ${th * 0.9} ${tw * 0.71} ${th * 0.55} ${tw} 0 Z`;
    Object.assign(tail.style, { width: `${tw}px`, height: `${th}px`, top: `${bubble.offsetHeight - 1}px`,
      [rtl ? 'right' : 'left']: `${Math.round(em * 1.1)}px`, clipPath: `path('${curve}')` });
    const g = bubble.getBoundingClientRect();
    const c = chip.getBoundingClientRect();
    const tapAt = [c.left - g.left + c.width / 2, c.top - g.top + c.height / 2];
    const tapR = Math.max(c.width * 0.8, c.height * 1.1);
    card.style.transformOrigin = `${rtl ? '90%' : '10%'} 100%`;
    return { tapAt, tapR, group, card, icon, units, chip, ripple, f: tokens.frames, ...timing(params, tokens, mg),
      totalS: timing(params, tokens, mg).total / mg.fps };
  },
  duration(params, tokens, mg) {
    return timing(params, tokens, mg).total / mg.fps;
  },
  still(params, tokens, mg) {
    return (timing(params, tokens, mg).inEnd + 6) / mg.fps;
  },
  seek(t, s, mg) {
    const { F, ease, win } = mg;
    const q = ease.exit(win(t, s.totalS - F(OUT), F(OUT)));
    const b = win(t, 0, F(BUBBLE));
    const k = 0.86 + 0.14 * ease.pop(b);
    s.card.style.transform = `translateY(${(1 - ease.enter(b)) * 36 + q * 22}px) scale(${k * (1 - 0.06 * q)})`;
    mg.show(s.card, ease.enter(Math.min(1, b * 2)) * (1 - q));
    const ic = win(t, F(4), F(8));
    s.icon.style.transform = `scale(${0.3 + 0.7 * ease.pop(ic)})`;
    s.units.forEach((u, i) => {
      if (u === s.chip) {
        const c = win(t, F(s.chipAt), F(CHIP_IN));
        // Tap: a 3f press and 6f release, once.
        const press = ease.enter(win(t, F(s.tap), F(3))) - ease.enter(win(t, F(s.tap + 3), F(6)));
        u.style.transform = `scale(${(0.5 + 0.5 * ease.pop(c)) * (1 - 0.07 * press)})`;
        u.style.opacity = String(ease.enter(Math.min(1, c * 2)));
        return;
      }
      const p = ease.enter(win(t, F(WORDS_AT + i * s.f.stagger), F(s.f.in)));
      u.style.opacity = String(p);
      u.style.transform = `translateY(${(1 - p) * 0.3}em)`;
    });
    const r = win(t, F(s.tap + 1), F(14));
    const a = r > 0 && r < 1 ? 0.22 * (1 - r) : 0;
    const rad = (0.35 + 0.65 * ease.enter(r)) * s.tapR;
    s.ripple.style.background = a > 0
      ? `radial-gradient(circle at ${s.tapAt[0]}px ${s.tapAt[1]}px, ${mg.rgba('indigo', a)} ${rad - 1}px, ${mg.rgba('indigo', 0)} ${rad}px)` : 'none';
  },
});
</script>
</body>
</html>
